name: "build-devshells"

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    uses: $/.github/workflows/detect-changes.yml

  build-devshells-linux:
    needs: detect-changes
    if: needs.detect-changes.outputs.templates != '[]'
    timeout-minutes: 60
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@bec50b45a8bb06017c42af46702a3f502adcfa9e # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: gawakawa
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build devShells (Linux)
        env:
          TEMPLATES: ${{ needs.detect-changes.outputs.templates }}
        run: |
          while IFS= read -r p; do nix develop --accept-flake-config "$p" -c echo "DevShell works"; done \
            < <(jq -r '.[] | "./templates/\(.)"' <<< "$TEMPLATES")

  build-devshells-macos:
    needs: detect-changes
    if: needs.detect-changes.outputs.templates != '[]'
    timeout-minutes: 60
    permissions:
      contents: read
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@bec50b45a8bb06017c42af46702a3f502adcfa9e # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: gawakawa
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build devShells (macOS)
        env:
          TEMPLATES: ${{ needs.detect-changes.outputs.templates }}
          MACOS_EXCLUDE: '["purs-nix-browser", "purs-nix-node", "haskell"]'
        run: |
          while IFS= read -r p; do nix develop --accept-flake-config "$p" -c echo "DevShell works"; done \
            < <(jq -r --argjson exclude "$MACOS_EXCLUDE" '.[] | select(IN($exclude[]) | not) | "./templates/\(.)"' <<< "$TEMPLATES")
