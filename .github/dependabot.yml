version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/templates/pnpm"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3

  - package-ecosystem: "npm"
    directory: "/templates/purs-nix"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/templates/crane/.github/workflows"
      - "/templates/crane-workspace/.github/workflows"
      - "/templates/deno/.github/workflows"
      - "/templates/flake-parts/.github/workflows"
      - "/templates/go/.github/workflows"
      - "/templates/haskell/.github/workflows"
      - "/templates/idris2/.github/workflows"
      - "/templates/lean/.github/workflows"
      - "/templates/ocaml/.github/workflows"
      - "/templates/pack/.github/workflows"
      - "/templates/pnpm/.github/workflows"
      - "/templates/purs-nix/.github/workflows"
      - "/templates/python/.github/workflows"
      - "/templates/rust-overlay/.github/workflows"
      - "/templates/rustup/.github/workflows"
      - "/templates/terraform/.github/workflows"
      - "/templates/uv2nix/.github/workflows"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]
        group-by: "dependency-name"

  - package-ecosystem: "pip"
    directory: "/templates/uv2nix"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3

  - package-ecosystem: "cargo"
    directories:
      - "/init-env"
      - "/templates/crane"
      - "/templates/crane-workspace"
      - "/templates/rust-overlay"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      cargo:
        patterns: ["*"]
        group-by: "dependency-name"
