paths:
  .github/workflows/**/*.yml:
    ignore:
      # Workaround: actionlint <= 1.7.12 doesn't support the `$/` self-repository
      # syntax (rhysd/actionlint#711). Remove once supported.
      - 'reusable workflow call "\$/.*" at "uses" is not following the format'
      - 'specifying action "\$/.*" in invalid format because ref is missing'
