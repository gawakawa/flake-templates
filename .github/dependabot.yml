version: 2
updates:
  # Everything else is managed by Renovate (renovate.json).
  # Kept on Dependabot because update-pnpm-hash.yml relies on its PRs.
  - package-ecosystem: "npm"
    directory: "/templates/pnpm"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
